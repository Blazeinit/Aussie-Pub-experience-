<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frosted Glass</title>
<style>
  html,body{margin:0;height:100%;background:#050804;overflow:hidden;font-family:Georgia,serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh*1.5));height:auto;aspect-ratio:3/2;background:#000;box-shadow:0 0 80px #000;cursor:crosshair}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>
<script>
(() => {
'use strict';
const T = 32, W = 30, H = 20, CW = 960, CH = 640;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

/* ---------------------------------------------------------------- map */
const g = Array.from({ length: H }, () => Array(W).fill('#'));
const carve = (x1, y1, x2, y2) => { for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) g[y][x] = '.'; };
const put = (c, pts) => pts.forEach(([x, y]) => { g[y][x] = c; });
const rect = (c, x1, y1, x2, y2) => { for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) g[y][x] = c; };

// rooms: bedroom, study, lab / corridor / kitchen, living room, greenhouse / foyer
carve(1, 1, 5, 4); carve(7, 1, 14, 4); carve(16, 1, 28, 4);
carve(1, 6, 28, 7);
carve(1, 9, 9, 13); carve(11, 9, 19, 13); carve(21, 9, 28, 13);
carve(1, 15, 28, 18);
// doorways
put('.', [[3,5],[10,5],[11,5],[17,5],[21,5],[22,5],[4,8],[12,8],[13,8],[24,8],[5,14],[14,14],[15,14],[24,14],[25,14]]);
// furniture (solid)
rect('f', 1, 3, 2, 4);              // bed
rect('f', 9, 2, 11, 2);             // desk
rect('f', 20, 3, 24, 3);            // lab table
rect('f', 4, 11, 6, 11);            // kitchen island
rect('f', 13, 10, 17, 10);          // couch
rect('f', 14, 12, 16, 12);          // coffee table
rect('f', 23, 10, 26, 10); rect('f', 23, 12, 26, 12);   // planters
put('f', [[8,17],[21,17]]);         // pillars
// hiding closets
const CLOSETS = [[5,1],[7,4],[28,1],[9,9],[11,9],[19,13],[28,9],[1,18],[28,15]];
put('H', CLOSETS);
// front gate
put('E', [[14,19],[15,19]]);

const solid = (tx, ty) => tx < 0 || ty < 0 || tx >= W || ty >= H || '#fHE'.includes(g[ty][tx]);
const walk = (tx, ty) => !solid(tx, ty);
const px = t => (t + 0.5) * T;

/* ---------------------------------------------------------------- static map layer */
const mapC = document.createElement('canvas'); mapC.width = CW; mapC.height = CH;
(function buildMap() {
  const m = mapC.getContext('2d');
  const room = (x, y) => {
    if (y <= 4) return x <= 5 ? 0 : x <= 14 ? 1 : 2;
    if (y <= 7) return 3;
    if (y <= 13) return x <= 9 ? 4 : x <= 19 ? 5 : 6;
    return 7;
  };
  const A = ['#27301f','#2d2b1d','#1f2c2e','#232623','#2e2e26','#2a2420','#1e3020','#2b2d2b'];
  const B = ['#2b3523','#322f20','#233134','#272a27','#33332a','#2e2823','#223524','#2f312f'];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = g[y][x], X = x * T, Y = y * T;
    if (c === '#') {
      m.fillStyle = '#0b100c'; m.fillRect(X, Y, T, T);
      m.fillStyle = '#141b15'; m.fillRect(X + 1, Y + 1, T - 2, T / 2 - 2); m.fillRect(X + 1, Y + T / 2 + 1, T - 2, T / 2 - 2);
      m.fillStyle = '#1a231b'; m.fillRect(X + 1, Y + 1, T - 2, 2);
      continue;
    }
    const r = room(x, y);
    m.fillStyle = (x + y) % 2 ? A[r] : B[r]; m.fillRect(X, Y, T, T);
    if (c === 'f') {
      m.fillStyle = '#2c1f15'; m.fillRect(X + 1, Y + 1, T - 2, T - 2);
      m.fillStyle = '#3d2c1d'; m.fillRect(X + 3, Y + 3, T - 6, T - 8);
      m.fillStyle = '#4b3825'; m.fillRect(X + 3, Y + 3, T - 6, 3);
    } else if (c === 'H') {
      m.fillStyle = '#1c1612'; m.fillRect(X + 1, Y + 1, T - 2, T - 2);
      m.fillStyle = '#2a211a'; m.fillRect(X + 3, Y + 3, T - 6, T - 6);
      m.fillStyle = '#0d0a08'; m.fillRect(X + T / 2 - 1, Y + 3, 2, T - 6);
      m.fillStyle = '#6b5a3a'; m.fillRect(X + T / 2 - 5, Y + T / 2, 3, 3); m.fillRect(X + T / 2 + 2, Y + T / 2, 3, 3);
    } else if (c === 'E') {
      m.fillStyle = '#0a0a0a'; m.fillRect(X, Y, T, T);
      m.strokeStyle = '#5a5f55'; m.lineWidth = 2;
      for (let i = 4; i < T; i += 8) { m.beginPath(); m.moveTo(X + i, Y); m.lineTo(X + i, Y + T); m.stroke(); }
      m.fillStyle = '#7a6a2a'; m.fillRect(X, Y + T / 2 - 2, T, 4);
    }
  }
  // lift the whole map so rooms read once lit
  m.globalCompositeOperation = 'lighter'; m.fillStyle = 'rgb(46,58,40)'; m.fillRect(0, 0, CW, CH); m.globalCompositeOperation = 'source-over';
  m.fillStyle = 'rgba(0,0,0,.25)';
  for (let i = 0; i < 40; i++) { m.beginPath(); m.ellipse(Math.random() * CW, Math.random() * CH, 4 + Math.random() * 10, 3 + Math.random() * 7, Math.random() * 3, 0, 7); m.fill(); }
})();

/* ---------------------------------------------------------------- frosted-glass pattern */
const frost = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 6;
  const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 6, 6);
  gr.addColorStop(0, 'rgba(255,255,230,.6)'); gr.addColorStop(.5, 'rgba(255,255,230,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)');
  x.fillStyle = gr; x.fillRect(0, 0, 6, 6);
  x.strokeStyle = 'rgba(0,0,0,.4)'; x.strokeRect(.5, .5, 5, 5);
  return ctx.createPattern(c, 'repeat');
})();
function frostOverlay(a) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = frost; ctx.fillRect(0, 0, CW, CH); ctx.restore(); }

/* ---------------------------------------------------------------- audio */
let AC = null, master = null, muted = false;
function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(AC.destination);
  [[55, 'sine', .05], [55.8, 'sine', .05], [82.4, 'triangle', .012]].forEach(([f, t, v]) => {
    const o = AC.createOscillator(); o.type = t; o.frequency.value = f;
    const gn = AC.createGain(); gn.gain.value = v; o.connect(gn).connect(master); o.start();
  });
  const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const n = AC.createBufferSource(); n.buffer = buf; n.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = .4;
  const gn = AC.createGain(); gn.gain.value = .045; n.connect(f).connect(gn).connect(master); n.start();
}
function tone(freq, dur, type = 'sine', vol = .2, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(gn).connect(master); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  thump: v => { tone(62, .16, 'sine', v, -25); setTimeout(() => tone(55, .14, 'sine', v * .8, -20), 140); },
  sting: () => { tone(220, .8, 'sawtooth', .12, -150); tone(233, .8, 'sawtooth', .1, -160); },
  pick: () => { tone(660, .12, 'triangle', .15); setTimeout(() => tone(990, .2, 'triangle', .15), 90); },
  clack: () => tone(900, .05, 'square', .08, -400),
  door: () => tone(120, .25, 'square', .08, -60),
  caught: () => { tone(90, 1.2, 'sawtooth', .2, -60); tone(400, 1.2, 'sine', .1, -300); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .4, 'triangle', .16), i * 160)),
};

/* ---------------------------------------------------------------- input */
const keys = {}; const mouse = { x: CW / 2, y: CH / 2, moved: false };
let mode = 'title';
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true; initAudio();
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : .55; }
  if (mode === 'title' && (e.code === 'Enter' || e.code === 'Space')) startGame();
  else if (mode === 'caught' && (e.code === 'KeyR' || e.code === 'Enter')) respawn();
  else if (mode === 'win' && (e.code === 'Enter' || e.code === 'KeyR')) startGame();
  else if (mode === 'play') {
    if (e.code === 'KeyE') interact();
    if (e.code === 'KeyF' && !P.hidden) { G.flash = !G.flash; sfx.clack(); }
    if (e.code === 'Space') throwPebble();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function setMouse(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * CW / r.width; mouse.y = (e.clientY - r.top) * CH / r.height; mouse.moved = true; }
cv.addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => { setMouse(e); initAudio(); if (mode === 'title') startGame(); else if (mode === 'play') throwPebble(); });

/* ---------------------------------------------------------------- game state */
let G, P, D, items, noises, flying, snap = null, deaths = 0;
const WAYPOINTS = [[18,3],[26,3],[10,3],[3,3],[3,6],[3,11],[5,16],[14,17],[14,11],[25,11],[25,16],[25,6]];
const NOTES = [
  [4, 1, "Scratched into the wall:\nTHREE PIECES. THE GATE. DON'T RUN. HE HEARS."],
  [2, 13, 'A tray set for guests who never come down to dinner.'],
  [18, 17, 'He split the gate key in three so nobody could leave in a hurry.'],
];
const KEYPOS = [[12, 3], [22, 2], [27, 11]];

function freshItems() {
  return [
    ...KEYPOS.map(([x, y]) => ({ type: 'key', x: px(x), y: px(y), taken: false })),
    ...NOTES.map(([x, y, text]) => ({ type: 'note', x: px(x), y: px(y), text, taken: false })),
  ];
}
function resetActors() {
  P = { x: px(3), y: px(2), r: 7, stam: 1, tired: false, hidden: null, aim: 0, mode: 'walk', moving: false, stepT: 0, risk: 0 };
  D = { x: px(20), y: px(1), r: 9, state: 'patrol', phase: 'go', face: Math.PI / 2, path: [], wp: 0, wait: 2, detect: 0, lost: 0,
        lastSeen: null, target: null, look: 0, pathT: 0, knows: null, closetT: 0 };
  noises = []; flying = [];
}
function startGame() {
  G = { t: 0, keys: 0, pebbles: 5, flash: true, toast: '', toastT: 0, lockedT: 0, hbT: 0 };
  items = freshItems(); deaths = 0; resetActors(); mode = 'play';
  say('Find the three key pieces. Reach the front gate.', 4);
}
function respawn() { resetActors(); mode = 'play'; say('You wake up in the bedroom. The key pieces you found are still yours.', 4); }
function say(t, s = 3) { G.toast = t; G.toastT = s; }

/* ---------------------------------------------------------------- geometry helpers */
function hit(e) {
  const r = e.r;
  for (const [cx, cy] of [[-r, -r], [r, -r], [-r, r], [r, r]]) if (solid(Math.floor((e.x + cx) / T), Math.floor((e.y + cy) / T))) return true;
  return false;
}
function move(e, dx, dy) { e.x += dx; if (hit(e)) e.x -= dx; e.y += dy; if (hit(e)) e.y -= dy; }
function los(x1, y1, x2, y2) {
  const d = Math.hypot(x2 - x1, y2 - y1), n = Math.ceil(d / 4);
  for (let i = 1; i < n; i++) { const t = i / n; if (solid(Math.floor((x1 + (x2 - x1) * t) / T), Math.floor((y1 + (y2 - y1) * t) / T))) return false; }
  return true;
}
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const turnTo = (a, b, k) => { const d = angDiff(b, a); return a + Math.sign(d) * Math.min(Math.abs(d), k); };
function castPoly(x, y, ang, half, range, n) {
  const pts = [[x, y]];
  for (let i = 0; i <= n; i++) {
    const a = ang - half + 2 * half * i / n, cx = Math.cos(a), cy = Math.sin(a);
    let d = 0;
    while (d < range && !solid(Math.floor((x + cx * (d + 5)) / T), Math.floor((y + cy * (d + 5)) / T))) d += 5;
    pts.push([x + cx * d, y + cy * d]);
  }
  return pts;
}
function bfs(sx, sy, tx, ty) {
  if (!walk(tx, ty)) return [];
  const prev = new Int16Array(W * H).fill(-1), q = [sy * W + sx]; prev[sy * W + sx] = sy * W + sx;
  for (let i = 0; i < q.length; i++) {
    const c = q[i], cx = c % W, cy = (c / W) | 0;
    if (cx === tx && cy === ty) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (walk(nx, ny) && prev[ny * W + nx] < 0) { prev[ny * W + nx] = c; q.push(ny * W + nx); }
    }
  }
  if (prev[ty * W + tx] < 0) return [];
  const out = []; let c = ty * W + tx;
  while (c !== sy * W + sx) { out.push([c % W, (c / W) | 0]); c = prev[c]; }
  return out.reverse();
}
const tileOf = e => [Math.floor(e.x / T), Math.floor(e.y / T)];
function pathTo(x, y) { const [sx, sy] = tileOf(D); D.path = bfs(sx, sy, Math.floor(x / T), Math.floor(y / T)); }
function closetNeighbour(c) {
  for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) if (walk(c[0] + dx, c[1] + dy)) return [c[0] + dx, c[1] + dy];
  return c;
}

/* ---------------------------------------------------------------- player actions */
function interact() {
  if (P.hidden) { exitCloset(); return; }
  let best = null, bd = 46;
  for (const c of CLOSETS) { const d = Math.hypot(px(c[0]) - P.x, px(c[1]) - P.y); if (d < bd) { bd = d; best = c; } }
  if (!best) return;
  P.hidden = best; sfx.door();
  const dd = Math.hypot(D.x - P.x, D.y - P.y);
  if (D.state === 'chase' && dd < 280 && los(D.x, D.y, P.x, P.y)) { D.knows = best; D.state = 'closet'; D.path = []; pathTo(...closetNeighbour(best).map(px)); }
  say('Hiding. Stay quiet. Press E to come out.', 2.5);
}
function exitCloset() {
  const c = P.hidden, [nx, ny] = closetNeighbour(c);
  P.x = px(nx); P.y = px(ny); P.hidden = null; P.risk = 0; sfx.door();
}
function throwPebble() {
  if (P.hidden || G.pebbles <= 0) return;
  G.pebbles--;
  const a = P.aim; let d = 0;
  while (d < 260 && !solid(Math.floor((P.x + Math.cos(a) * (d + 6)) / T), Math.floor((P.y + Math.sin(a) * (d + 6)) / T))) d += 6;
  flying.push({ sx: P.x, sy: P.y, x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, t: 0 });
}
function emitNoise(x, y, r) {
  noises.push({ x, y, r, t: 0 });
  const d = Math.hypot(D.x - x, D.y - y), eff = los(x, y, D.x, D.y) ? r : r * .55;
  if (d < eff && ['patrol', 'investigate', 'search'].includes(D.state)) {
    D.state = 'investigate'; D.phase = 'go'; D.target = { x, y }; pathTo(x, y); D.detect = Math.max(D.detect, .2);
  }
}

/* ---------------------------------------------------------------- update */
function updatePlayer(dt) {
  if (mouse.moved) P.aim = Math.atan2(mouse.y - P.y, mouse.x - P.x);
  if (P.hidden) { P.moving = false; P.mode = 'walk'; P.stam = Math.min(1, P.stam + dt * .3); return; }
  const ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  P.moving = !!(ix || iy);
  P.mode = keys.KeyC ? 'sneak' : ((keys.ShiftLeft || keys.ShiftRight) && !P.tired && P.stam > 0.02) ? 'run' : 'walk';
  if (P.mode === 'run' && P.moving) { P.stam -= dt * .28; if (P.stam <= 0) { P.stam = 0; P.tired = true; } }
  else { P.stam = Math.min(1, P.stam + dt * .16); if (P.tired && P.stam > .35) P.tired = false; }
  if (P.moving) {
    const sp = { sneak: 55, walk: 100, run: 165 }[P.mode], l = Math.hypot(ix, iy);
    move(P, ix / l * sp * dt, iy / l * sp * dt);
    if (!mouse.moved) P.aim = Math.atan2(iy, ix);
    P.stepT -= dt;
    if (P.stepT <= 0 && P.mode !== 'sneak') { emitNoise(P.x, P.y, P.mode === 'run' ? 175 : 50); P.stepT = P.mode === 'run' ? .38 : .55; }
  }
  // pickups
  for (const it of items) {
    if (it.taken || Math.hypot(it.x - P.x, it.y - P.y) > 20) continue;
    it.taken = true;
    if (it.type === 'key') { G.keys++; sfx.pick(); say(G.keys < 3 ? `Key piece found (${G.keys}/3).` : 'All three pieces. Get to the front gate. South wall.', 3.5); }
    else say(it.text, 5);
  }
  // gate
  if (P.y > 18.3 * T && P.x > 13.4 * T && P.x < 16.6 * T) {
    if (G.keys >= 3) { mode = 'win'; sfx.win(); }
    else if (G.lockedT <= 0) { say(`The gate is locked. Key pieces: ${G.keys}/3.`, 2.5); G.lockedT = 2.5; }
  }
}

function updateDoctor(dt) {
  const dx = P.x - D.x, dy = P.y - D.y, dist = Math.hypot(dx, dy);
  let seen = false, range = 210 * (G.flash && !P.hidden ? 1.55 : 1) * (P.mode === 'sneak' ? .7 : P.mode === 'run' ? 1.2 : 1);
  if (D.state === 'chase') range *= 1.4;
  if (!P.hidden && dist < range && los(D.x, D.y, P.x, P.y)) {
    const da = Math.abs(angDiff(Math.atan2(dy, dx), D.face));
    if (da < .62 || dist < 34 || D.state === 'chase') seen = true;
  }
  if (seen) { D.detect += dt * (.9 + (1 - Math.min(1, dist / range)) * 2.6 + (D.state === 'chase' ? 5 : 0)); D.lastSeen = { x: P.x, y: P.y }; }
  else D.detect = Math.max(0, D.detect - dt * (D.state === 'chase' ? 0 : .5));
  D.detect = Math.min(1, D.detect);

  if (D.detect >= 1 && D.state !== 'chase' && D.state !== 'closet') { D.state = 'chase'; D.lost = 0; sfx.sting(); say('He has seen you. RUN.', 2); }

  // caught?
  if (!P.hidden && dist < 19 && D.state !== 'patrol' || (!P.hidden && dist < 14)) return caught();

  const staring = seen && D.detect > .25 && D.state !== 'chase';
  if (staring) { D.face = turnTo(D.face, Math.atan2(dy, dx), dt * 5); return; }

  switch (D.state) {
    case 'patrol': {
      if (D.wait > 0) { D.wait -= dt; D.face += Math.sin(G.t * 1.6) * dt * .9; return; }
      if (!D.path.length) { D.wp = (D.wp + 1) % WAYPOINTS.length; pathTo(px(WAYPOINTS[D.wp][0]), px(WAYPOINTS[D.wp][1])); }
      if (followPath(dt, 62)) D.wait = 1.2 + Math.random() * 1.6;
      break;
    }
    case 'investigate': case 'search': {
      if (D.phase === 'go') {
        if (followPath(dt, D.state === 'search' ? 95 : 80)) { D.phase = 'look'; D.look = D.state === 'search' ? 4 : 2.5; P.risk = 0; }
      } else {
        D.look -= dt; D.face += Math.sin(G.t * 2.4) * dt * 2.2;
        if (P.hidden && Math.hypot(P.x - D.x, P.y - D.y) < 75) {
          P.risk += dt;
          if (P.risk > 2.6) { D.knows = P.hidden; D.state = 'closet'; pathTo(...closetNeighbour(P.hidden).map(px)); return; }
        }
        if (D.look <= 0) backToPatrol();
      }
      break;
    }
    case 'chase': {
      if (seen) D.lost = 0; else D.lost += dt;
      if (D.lost > 1.6 && D.lastSeen) { D.state = 'search'; D.phase = 'go'; D.target = D.lastSeen; pathTo(D.lastSeen.x, D.lastSeen.y); D.detect = .4; break; }
      D.pathT -= dt;
      if (D.pathT <= 0 || !D.path.length) { const tgt = (seen || !D.lastSeen) ? P : D.lastSeen; pathTo(tgt.x, tgt.y); D.pathT = .2; }
      if (D.path.length) followPath(dt, 128);
      else { const t = seen ? P : D.lastSeen; if (t) { const a = Math.atan2(t.y - D.y, t.x - D.x); move(D, Math.cos(a) * 128 * dt, Math.sin(a) * 128 * dt); D.face = a; } }
      break;
    }
    case 'closet': {
      if (followPath(dt, 120)) {
        D.closetT += dt;
        const c = D.knows; D.face = Math.atan2(px(c[1]) - D.y, px(c[0]) - D.x);
        if (D.closetT > .7) { if (P.hidden && P.hidden === c) return caught(); D.closetT = 0; D.knows = null; backToPatrol(); }

  }
}
function followPath(dt, speed) {
  if (!D.path.length) return true;
  const [tx, ty] = D.path[0], cx = px(tx), cy = px(ty), dx = cx - D.x, dy = cy - D.y, d = Math.hypot(dx, dy), step = speed * dt;
  D.face = turnTo(D.face, Math.atan2(dy, dx), dt * 7);
  if (d <= step) { D.x = cx; D.y = cy; D.path.shift(); return D.path.length === 0; }

}
function backToPatrol() {
  D.state = 'patrol'; D.path = []; D.wait = .6; D.detect = 0; D.lastSeen = null; D.knows = null; P.risk = 0;
  let b = 0, bd = 1e9; WAYPOINTS.forEach((w, i) => { const d = Math.hypot(px(w[0]) - D.x, px(w[1]) - D.y); if (d < bd) { bd = d; b = i; } });
  D.wp = (b + WAYPOINTS.length - 1) % WAYPOINTS.length;
}
function caught() {
  if (mode !== 'play') return;
  deaths++; sfx.caught();
  snap = document.createElement('canvas'); snap.width = CW; snap.height = CH; snap.getContext('2d').drawImage(cv, 0, 0);
  mode = 'caught';
}

function update(dt) {
  G.t += dt; G.toastT -= dt; G.lockedT -= dt;
  updatePlayer(dt);
  if (mode !== 'play') return;
  for (const f of flying) {
    f.t += dt / .35; const k = Math.min(1, f.t);
    f.cx = f.sx + (f.x - f.sx) * k; f.cy = f.sy + (f.y - f.sy) * k - Math.sin(k * Math.PI) * 18;
    if (f.t >= 1 && !f.done) { f.done = true; sfx.clack(); emitNoise(f.x, f.y, 320); }
  }
  flying = flying.filter(f => !f.done);
  for (const n of noises) n.t += dt; noises = noises.filter(n => n.t < .8);
  updateDoctor(dt);
  // heartbeat grows with threat
  const dist = Math.hypot(D.x - P.x, D.y - P.y);
  const threat = Math.max(D.detect, D.state === 'chase' || D.state === 'closet' ? 1 : 0, Math.max(0, 1 - dist / 260) * (los(D.x, D.y, P.x, P.y) ? 1 : .5));
  G.threat = threat;
  G.hbT -= dt;
  if (G.hbT <= 0 && threat > .08) { sfx.thump(.1 + threat * .35); G.hbT = 1.1 - threat * .75; }
}

/* ---------------------------------------------------------------- rendering */
const dark = document.createElement('canvas'); dark.width = CW; dark.height = CH; const dk = dark.getContext('2d');
function lightPoly(x, y, ang, half, range, n, alpha) {
  const pts = castPoly(x, y, ang, half, range, n);
  const gr = dk.createRadialGradient(x, y, 0, x, y, range);
  gr.addColorStop(0, `rgba(0,0,0,${alpha})`); gr.addColorStop(.55, `rgba(0,0,0,${alpha * .7})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  dk.fillStyle = gr; dk.beginPath(); pts.forEach((p, i) => i ? dk.lineTo(p[0], p[1]) : dk.moveTo(p[0], p[1])); dk.closePath(); dk.fill();
}
function buildDark() {
  dk.globalCompositeOperation = 'source-over'; dk.fillStyle = 'rgba(2,8,3,.78)'; dk.fillRect(0, 0, CW, CH);
  dk.globalCompositeOperation = 'destination-out';
  lightPoly(P.x, P.y, 0, Math.PI, P.hidden ? 24 : 62, 36, .95);
  if (G.flash && !P.hidden) lightPoly(P.x, P.y, P.aim, .45, 290, 34, 1);
  lightPoly(D.x, D.y, 0, Math.PI, 42, 28, .9);
  lightPoly(D.x, D.y, D.face, .62, 235, 34, .8);
  for (const it of items) if (!it.taken) { const gr = dk.createRadialGradient(it.x, it.y, 0, it.x, it.y, 30); gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); dk.fillStyle = gr; dk.fillRect(it.x - 30, it.y - 30, 60, 60); }
  dk.globalCompositeOperation = 'source-over';
}
function drawItem(it) {
  const p = .5 + .5 * Math.sin(G.t * 3 + it.x);
  if (it.type === 'key') {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(G.t * 2) * .2);
    ctx.fillStyle = `rgba(230,200,90,${.7 + p * .3})`; ctx.beginPath(); ctx.arc(-4, 0, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#0b0b05'; ctx.beginPath(); ctx.arc(-4, 0, 2, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(230,200,90,${.7 + p * .3})`; ctx.fillRect(0, -1.5, 11, 3); ctx.fillRect(8, 0, 2, 5); ctx.fillRect(4, 0, 2, 4);
    ctx.restore();
  } else {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(.2); ctx.fillStyle = '#cfc7a0'; ctx.fillRect(-6, -7, 12, 14);
    ctx.fillStyle = '#6b6648'; for (let i = 0; i < 4; i++) ctx.fillRect(-4, -5 + i * 3, 8, 1); ctx.restore();
  }
}
function drawDoctor() {
  ctx.save(); ctx.translate(D.x, D.y); ctx.rotate(D.face);
  ctx.fillStyle = '#d9e0e2'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 12, 0, 0, 7); ctx.fill();            // white coat
  ctx.fillStyle = '#7d1c1c'; ctx.beginPath(); ctx.arc(-1, 5, 3, 0, 7); ctx.arc(-3, -6, 2.5, 0, 7); ctx.fill(); // stains
  ctx.fillStyle = '#c9b79a'; ctx.beginPath(); ctx.arc(2, 0, 6, 0, 7); ctx.fill();                          // head
  ctx.fillStyle = '#9fc0c8'; ctx.beginPath(); ctx.arc(5, 0, 3.2, -1.5, 1.5); ctx.fill();                   // mask
  ctx.fillStyle = '#d9e0e2'; ctx.fillRect(4, -11, 9, 3); ctx.fillRect(4, 8, 9, 3);                         // arms forward
  ctx.restore();
  if (D.state === 'chase') { ctx.fillStyle = '#ff3030'; ctx.font = 'bold 22px Georgia'; ctx.textAlign = 'center'; ctx.fillText('!', D.x, D.y - 18); }
  else if (D.detect > .25) { ctx.fillStyle = `rgba(255,200,60,${.4 + D.detect})`; ctx.font = 'bold 20px Georgia'; ctx.textAlign = 'center'; ctx.fillText('?', D.x, D.y - 18); }
}
function drawPlayer() {
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.aim);
  ctx.fillStyle = '#3a5a73'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#d3b89a'; ctx.beginPath(); ctx.arc(1, 0, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#c9c9c9'; ctx.fillRect(4, 4, 7, 3);   // torch in hand
  ctx.restore();
}
function drawNoises() {
  for (const n of noises) { ctx.strokeStyle = `rgba(200,230,180,${.35 * (1 - n.t / .8)})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(n.x, n.y, Math.min(n.r, n.r * n.t / .5), 0, 7); ctx.stroke(); }
  ctx.fillStyle = '#bbb'; for (const f of flying) { ctx.beginPath(); ctx.arc(f.cx, f.cy, 2.5, 0, 7); ctx.fill(); }
}
function bar(x, y, w, h, v, col) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, y, w, h); ctx.fillStyle = col; ctx.fillRect(x + 1, y + 1, (w - 2) * v, h - 2); ctx.strokeStyle = 'rgba(200,220,170,.4)'; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1); }
function text(s, x, y, size = 16, col = '#d4e2b8', align = 'left', font = 'Georgia, serif') { ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.fillStyle = col; ctx.fillText(s, x, y); }
function drawHUD() {
  ctx.save();
  text('KEY PIECES', 18, 28, 13, '#9db07e'); for (let i = 0; i < 3; i++) { ctx.fillStyle = i < G.keys ? '#e6c85a' : 'rgba(255,255,255,.12)'; ctx.fillRect(18 + i * 26, 36, 20, 10); }
  text(`PEBBLES  ${G.pebbles}`, 18, 70, 13, '#9db07e');
  text(`FLASHLIGHT  ${G.flash ? 'ON' : 'OFF'}`, 18, 90, 13, G.flash ? '#e6e0a0' : '#778');
  text('STAMINA', 18, 618, 11, '#9db07e'); bar(78, 608, 120, 10, P.stam, P.tired ? '#a55' : '#8fb070');
  const m = Math.floor(G.t / 60), s = Math.floor(G.t % 60); text(`${m}:${String(s).padStart(2, '0')}`, CW - 18, 28, 14, '#9db07e', 'right');
  if (deaths) text(`Caught ${deaths}x`, CW - 18, 48, 12, '#a77', 'right');
  if (!P.hidden) {
    const near = CLOSETS.find(c => Math.hypot(px(c[0]) - P.x, px(c[1]) - P.y) < 46);
    if (near) text('E — hide', px(near[0]), px(near[1]) - 22, 13, '#e8f0d0', 'center');
  } else text('HIDING — E to come out', CW / 2, 44, 15, '#e8f0d0', 'center');
  if (G.toastT > 0) {
    const lines = G.toast.split('\n'), bw = Math.max(...lines.map(l => l.length)) * 8.4 + 36, bh = lines.length * 22 + 14, a = Math.min(1, G.toastT);
    ctx.globalAlpha = a; ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(CW / 2 - bw / 2, 560 - bh + 6, bw, bh);
    lines.forEach((l, i) => text(l, CW / 2, 560 - bh + 28 + i * 22, 15, '#e8f0d0', 'center')); ctx.globalAlpha = 1;

function post() {

  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(${Math.round(th * 110)},0,0,${.55 + th * .3})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, CW, CH);

  if (mode === 'title') return drawTitle();
  if (mode === 'caught') return drawCaught();

  for (const it of items) if (!it.taken) drawItem(it);

  buildDark(); ctx.drawImage(dark, 0, 0);
  post(); drawHUD();
  if (mode === 'win') drawWin();
}

/* ---- poster-style screens */
function hand(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 26, 0, 0, 7); ctx.fill();
  [[-18, -1.45, 46], [-9, -1.62, 56], [1, -1.7, 60], [11, -1.82, 54], [20, -2.1, 40]].forEach(([ox, a, l]) => {
    ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(ox, -12); ctx.lineTo(ox + Math.cos(a) * l * .35, -12 + Math.sin(a) * l); ctx.stroke();
  });
  ctx.restore();
}
function silhouette(alpha) {
  ctx.save(); if ('filter' in ctx) ctx.filter = 'blur(7px)';
  ctx.fillStyle = `rgba(35,40,22,${alpha})`; ctx.strokeStyle = ctx.fillStyle;
  ctx.beginPath(); ctx.arc(CW / 2, 215, 38, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.roundRect(CW / 2 - 70, 255, 140, 250, 30); ctx.fill();
  ctx.lineWidth = 28; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(CW / 2 - 60, 275); ctx.lineTo(CW / 2 - 140, 190); ctx.lineTo(CW / 2 - 150, 110); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CW / 2 + 60, 275); ctx.lineTo(CW / 2 + 140, 190); ctx.lineTo(CW / 2 + 150, 110); ctx.stroke();
  hand(CW / 2 - 152, 95, .9, -.15); hand(CW / 2 + 152, 95, .9, .15);
  hand(120, 330, 1.1, .7); hand(840, 360, 1.1, -.8); hand(200, 520, 1.1, .5); hand(790, 560, 1, -.6);
  ctx.restore();
}
function glassBg(c0, c1) {
  const bg = ctx.createRadialGradient(CW / 2, 260, 40, CW / 2, 300, 560); bg.addColorStop(0, c0); bg.addColorStop(1, c1);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, CW, CH);
}
function drawTitle() {
  glassBg('#8fa05c', '#0f180b'); silhouette(.75);
  ctx.save(); ctx.fillStyle = 'rgba(120,20,15,.55)'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(780 + i * 18, 80 + (i % 3) * 38, 5, 14, .3, 0, 7); ctx.fill(); } ctx.restore();
  frostOverlay(.5);
  const vg = ctx.createLinearGradient(0, 380, 0, CH); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(.6, 'rgba(0,0,0,.85)'); ctx.fillStyle = vg; ctx.fillRect(0, 380, CW, 260);
  text("THEY CAN'T SEE YOU. YET.", CW / 2, 52, 22, '#e6edc8', 'center');
  ctx.save(); ctx.shadowColor = '#000'; ctx.shadowBlur = 16;
  text('FROSTED', CW / 2, 480, 78, '#dfe5d2', 'center'); text('GLASS', CW / 2, 548, 78, '#dfe5d2', 'center'); ctx.restore();
  const b = .5 + .5 * Math.sin(performance.now() / 380);
  text('PRESS ENTER', CW / 2, 590, 18, `rgba(230,240,200,${.4 + b * .6})`, 'center');
  text('WASD move · SHIFT run · C sneak · MOUSE aim · F torch · E hide · CLICK/SPACE throw pebble · M mute', CW / 2, 620, 12, '#a9b88b', 'center');
}
function drawCaught() {
  ctx.drawImage(snap, 0, 0);
  ctx.fillStyle = 'rgba(70,100,50,.6)'; ctx.fillRect(0, 0, CW, CH);
  silhouette(.9); frostOverlay(.65);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 230, CW, 150);
  text('CAUGHT', CW / 2, 310, 64, '#e6a39a', 'center');
  text('The glass is cold. The light goes out.', CW / 2, 345, 18, '#d4e2b8', 'center');
  text('Press R to wake up again — your key pieces stay with you', CW / 2, 372, 14, '#a9b88b', 'center');
}
function drawWin() {
  ctx.fillStyle = 'rgba(0,10,0,.88)'; ctx.fillRect(0, 0, CW, CH); frostOverlay(.12);
  text('YOU GOT OUT', CW / 2, 270, 64, '#e6edc8', 'center');
  text('Rain on your face. The gate swings shut behind you.', CW / 2, 315, 18, '#b9c9a0', 'center');
  const m = Math.floor(G.t / 60), s = Math.floor(G.t % 60);
  text(`Time ${m}:${String(s).padStart(2, '0')}   ·   Times caught: ${deaths}`, CW / 2, 360, 18, '#e6c85a', 'center');
  text('Press ENTER to play again', CW / 2, 410, 16, '#a9b88b', 'center');
}

/* ---------------------------------------------------------------- loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'play') update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hooks
window.__fg = { get mode() { return mode; }, get G() { return G; }, get P() { return P; }, get D() { return D; }, get items() { return items; }, grid: g, bfs, startGame, setMode: m => { mode = m; } };
})();
